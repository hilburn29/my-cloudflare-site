<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><title>PeetyF Pro</title>
<script src="https://jsdelivr.net"></script>
<script src="https://jsdelivr.net"></script>
<style>
:root{--acrobat-red:#FA0F00;--dark-canvas:#1E1E1E;--card-bg:#2B2B2B;--border-color:#3D3D3D;--white:#FFFFFF;--text-light:#F5F5F5;--text-gray:#B0B0B0;}
body{margin:0;font-family:'Segoe UI',sans-serif;background-color:var(--dark-canvas);color:var(--text-light);height:100vh;display:flex;flex-direction:column;overflow:hidden;}
header{background-color:#151515;border-bottom:1px solid var(--border-color);padding:12px 30px;display:flex;justify-content:space-between;align-items:center;}
.brand-section{display:flex;align-items:center;gap:10px;font-weight:700;font-size:18px;}
.nav-tabs{display:flex;background:#252525;border:1px solid var(--border-color);border-radius:6px;padding:3px;}
.nav-btn{background:none;border:none;color:var(--text-gray);padding:6px 18px;font-size:13px;font-weight:600;cursor:pointer;border-radius:4px;}
.nav-btn.active,.nav-btn:hover{background-color:var(--acrobat-red);color:var(--white);}
.domain-tag{font-size:13px;color:var(--text-gray);font-weight:600;}
.main-workspace{display:flex;padding:25px;gap:25px;box-sizing:border-box;overflow:hidden;height:calc(100vh - 60px);width:100%;}
.character-branding-panel{width:340px;min-width:340px;background-color:#151515;border:1px solid var(--border-color);border-radius:12px;padding:20px;display:flex;flex-direction:column;align-items:center;justify-content:space-between;box-sizing:border-box;}
.hero-graphic-frame{width:100%;height:340px;border-radius:8px;background-color:#252525;margin-bottom:20px;border:1px solid var(--border-color);display:flex;align-items:center;justify-content:center;overflow:hidden;}
.app-main-title{font-size:42px;font-weight:800;margin:0;color:var(--white);font-style:italic;text-align:center;}
.app-sub-prompt{font-size:13px;color:var(--text-gray);margin:6px 0 0 0;font-weight:600;text-align:center;}
.tools-view-workspace{flex:1;overflow-y:auto;padding-right:5px;display:block;}
.grid-header-title{font-size:24px;font-weight:700;margin:0 0 20px 0;color:var(--white);border-bottom:2px solid var(--acrobat-red);padding-bottom:8px;}
.functional-grid-system{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:16px;}
.tool-grid-card{background-color:var(--card-bg);border:1px solid var(--border-color);border-radius:8px;padding:20px;display:flex;flex-direction:column;justify-content:space-between;cursor:pointer;min-height:130px;box-sizing:border-box;}
.tool-grid-card:hover{border-color:var(--acrobat-red);background-color:#353535;}
.card-headline-row{display:flex;align-items:center;gap:10px;font-weight:700;font-size:15px;color:var(--white);margin-bottom:6px;}
.card-subtext-desc{font-size:12px;color:var(--text-gray);line-height:1.4;margin-bottom:12px;}
.card-action-trigger-label{font-size:11px;color:#0078D4;font-weight:600;}
.tool-runtime-panel{display:none;background-color:var(--card-bg);border:1px solid var(--border-color);border-radius:12px;flex:1;padding:30px;flex-direction:column;box-sizing:border-box;}
.runtime-top-navigation{display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid var(--border-color);padding-bottom:15px;margin-bottom:25px;}
.exit-runtime-btn{background-color:#333;color:var(--white);border:1px solid var(--border-color);padding:8px 18px;font-size:13px;font-weight:600;border-radius:6px;cursor:pointer;}
.exit-runtime-btn:hover{background-color:var(--acrobat-red);}
.merge-list-container{width:100%;max-width:550px;background:#151515;border:1px solid var(--border-color);border-radius:6px;padding:15px;margin-bottom:20px;min-height:100px;text-align:left;box-sizing:border-box;}
.merge-list-item{font-size:13px;padding:8px 12px;background:#252525;border:1px solid var(--border-color);margin-bottom:8px;border-radius:4px;display:flex;justify-content:space-between;}
.main-action-run-btn{background-color:var(--acrobat-red);color:var(--white);border:none;padding:12px 28px;border-radius:6px;font-weight:700;cursor:pointer;font-size:13px;}
.secondary-action-btn{background-color:#444;color:var(--white);border:none;padding:12px 28px;border-radius:6px;font-weight:700;cursor:pointer;font-size:13px;margin-right:10px;}
</style></head><body><header><div class="brand-section"> PeetyF Pro</div><div class="nav-tabs">
<button class="nav-btn" onclick="switchAcrobatCategory('file',this)">File</button>
<button class="nav-btn active" onclick="switchAcrobatCategory('edit',this)">Edit</button>
<button class="nav-btn" onclick="switchAcrobatCategory('convert',this)">Convert</button>
<button class="nav-btn" onclick="switchAcrobatCategory('esign',this)">E-sign</button></div>
<div class="domain-tag">brian-hilburn.com</div></header><main class="main-workspace"><div class="character-branding-panel"><div class="hero-graphic-frame">
<img src="https://github.com" style="width:100%;height:100%;object-fit:contain;" alt="PeetyF Hero"></div><div><h1 class="app-main-title">Peety<span>F</span></h1><div class="app-sub-prompt">Coming to a computer near you!</div></div></div>
<div class="tools-view-workspace" id="toolsViewWorkspace"><h2 class="grid-header-title" id="currentCategoryTitle">Edit Tools</h2><div class="functional-grid-system" id="toolGridBox"></div></div>
<div class="tool-runtime-panel" id="toolRuntimePanel"><div class="runtime-top-navigation"><h2 id="runtimeTitleLabel" style="margin:0;font-size:20px;font-weight:700;">Tool Panel</h2>
<button class="exit-runtime-btn" onclick="exitFeatureRuntime()">✕ Close Tool</button></div><div id="runtimeCanvasCore" style="flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;color:var(--text-gray);font-size:14px;width:100%;"></div></div></main>

const toolsViewWorkspace=document.getElementById('toolsViewWorkspace'),toolRuntimePanel=document.getElementById('toolRuntimePanel'),currentCategoryTitle=document.getElementById('currentCategoryTitle'),toolGridBox=document.getElementById('toolGridBox'),runtimeTitleLabel=document.getElementById('runtimeTitleLabel'),runtimeCanvasCore=document.getElementById('runtimeCanvasCore');let cacheMergeFilesPool=[];

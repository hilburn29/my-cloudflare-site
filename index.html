<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Brian Hilburn</title>
    <!-- Automatically loads the smart converter tool for your iPhone HEIC photos -->
    <script src="https://jsdelivr.net"></script>
    <style>
        body {
            background-color: #111;
            margin: 0;
            padding: 20px;
            font-family: sans-serif;
            display: flex;
            justify-content: center;
        }
        .gallery {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            grid-gap: 15px;
            max-width: 1200px;
            width: 100%;
        }
        .gallery-item, .heic-placeholder {
            width: 100%;
            height: 250px;
            object-fit: cover;
            border-radius: 8px;
            cursor: pointer;
            background-color: #222;
            transition: transform 0.2s;
            border: none;
        }
        .gallery-item:hover {
            transform: scale(1.02);
        }
        /* Fullscreen Pop-up Box */
        .lightbox {
            display: none;
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.9);
            justify-content: center;
            align-items: center;
            z-index: 1000;
        }
        .lightbox img, .lightbox video {
            max-width: 95%;
            max-height: 95%;
            border-radius: 4px;
        }
    </style>
</head>
<body>

    <div class="gallery">
        <!-- Exact file names matched to your GitHub Images folder -->
        <img src="Images/Bee-Image.jpg" class="gallery-item" onclick="openLightbox(this.src, 'img')">
        <img data-heic="Images/IMG_0119.HEIC" class="gallery-item heic-placeholder" onclick="openLightbox(this.src, 'img')">
        <img data-heic="Images/IMG_0120.HEIC" class="gallery-item heic-placeholder" onclick="openLightbox(this.src, 'img')">
        <img data-heic="Images/IMG_0122.HEIC" class="gallery-item heic-placeholder" onclick="openLightbox(this.src, 'img')">
        <img data-heic="Images/IMG_0123.HEIC" class="gallery-item heic-placeholder" onclick="openLightbox(this.src, 'img')">
        <img data-heic="Images/IMG_0124.HEIC" class="gallery-item heic-placeholder" onclick="openLightbox(this.src, 'img')">
        <img data-heic="Images/IMG_0125.HEIC" class="gallery-item heic-placeholder" onclick="openLightbox(this.src, 'img')">
        <img data-heic="Images/IMG_0127.HEIC" class="gallery-item heic-placeholder" onclick="openLightbox(this.src, 'img')">
    </div>

    <!-- Hidden pop-up box for expanding images and videos -->
    <div class="lightbox" id="lightbox" onclick="closeLightbox()">
        <div id="lightbox-content"></div>
    </div>

    <script>
        // Automatically converts your .HEIC pictures into viewable web formats
        document.querySelectorAll('img[data-heic]').forEach(async (img) => {
            const heicUrl = img.getAttribute('data-heic');
            try {
                const res = await fetch(heicUrl);
                const blob = await res.blob();
                const conversionResult = await heic2any({ blob, toType: "image/jpeg" });
                const imgUrl = URL.createObjectURL(conversionResult);
                img.src = imgUrl;
            } catch (error) {
                console.error("Error converting HEIC image:", error);
            }
        });

        function openLightbox(src, type) {
            if (!src) return;
            const lightbox = document.getElementById('lightbox');
            const content = document.getElementById('lightbox-content');
            
            if (type === 'img') {
                content.innerHTML = `<img src="${src}">`;
            } else if (type === 'video') {
                content.innerHTML = `<video src="${src}" controls autoplay></video>`;
            }
            lightbox.style.display = 'flex';
        }

        function closeLightbox() {
            document.getElementById('lightbox').style.display = 'none';
            document.getElementById('lightbox-content').innerHTML = '';
        }
    </script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PeetyF Pro - Local Desktop Edition</title>
<!-- Upgraded Engine Script Paths -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf-lib/1.17.1/pdf-lib.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
<script>
  if (typeof pdfjsLib !== 'undefined') {
    pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';
  }
</script>
<style>
:root {
  --acrobat-red: #FA0F00;
  --dark-canvas: #1E1E1E;
  --card-bg: #2B2B2B;
  --border-color: #3D3D3D;
  --white: #FFFFFF;
  --text-light: #F5F5F5;
  --text-gray: #B0B0B0;
}
body {
  margin: 0;
  font-family: 'Segoe UI', -apple-system, BlinkMacSystemFont, Roboto, sans-serif;
  background-color: var(--dark-canvas);
  color: var(--text-light);
  height: 100vh;
  display: flex;
  flex-direction: column;
  overflow: hidden;
}
header {
  background-color: #151515;
  border-bottom: 1px solid var(--border-color);
  padding: 12px 30px;
  display: flex;
  justify-content: space-between;
  align-items: center;
}
.brand-section {
  display: flex;
  align-items: center;
  gap: 10px;
  font-weight: 700;
  font-size: 18px;
  letter-spacing: 0.5px;
}
.nav-tabs {
  display: flex;
  background: #252525;
  border: 1px solid var(--border-color);
  border-radius: 6px;
  padding: 3px;
}
.nav-btn {
  background: none;
  border: none;
  color: var(--text-gray);
  padding: 6px 18px;
  font-size: 13px;
  font-weight: 600;
  cursor: pointer;
  border-radius: 4px;
  transition: all 0.2s;
}
.nav-btn.active, .nav-btn:hover {
  background-color: var(--acrobat-red);
  color: var(--white);
}
.domain-tag {
  font-size: 13px;
  color: var(--text-gray);
  font-weight: 600;
}
.main-workspace {
  display: flex;
  padding: 25px;
  gap: 25px;
  box-sizing: border-box;
  overflow: hidden;
  height: calc(100vh - 60px);
  width: 100%;
}
.character-branding-panel {
  width: 340px;
  min-width: 340px;
  background-color: #151515;
  border: 1px solid var(--border-color);
  border-radius: 12px;
  padding: 20px;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  box-sizing: border-box;
  overflow: hidden;
}
/* Expanded to take up the full height space of the previous two combined */
.hero-graphic-frame {
  width: 100%;
  height: 100%;
  border-radius: 8px;
  background-color: #111;
  border: 1px solid var(--border-color);
  display: flex;
  align-items: center;
  justify-content: center;
  overflow: hidden;
}
.hero-graphic-frame img {
  width: 100%;
  height: 100%;
  object-fit: contain;
}
.tools-view-workspace {
  flex: 1;
  overflow-y: auto;
  padding-right: 5px;
  display: block;
}
.grid-header-title {
  font-size: 24px;
  font-weight: 700;
  margin: 0 0 20px 0;
  color: var(--white);
  border-bottom: 2px solid var(--acrobat-red);
  padding-bottom: 8px;
}
.functional-grid-system {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(240px, 1fr));
  gap: 16px;
}
.tool-grid-card {
  background-color: var(--card-bg);
  border: 1px solid var(--border-color);
  border-radius: 8px;
  padding: 20px;
  display: flex;
  flex-direction: column;
  justify-content: space-between;
  cursor: pointer;
  transition: transform 0.15s, border-color 0.15s;
  min-height: 130px;
  box-sizing: border-box;
}
.tool-grid-card:hover {
  transform: translateY(-2px);
  border-color: var(--acrobat-red);
  background-color: #353535;
}
.card-headline-row {
  display: flex;
  align-items: center;
  gap: 10px;
  font-weight: 700;
  font-size: 15px;
  color: var(--white);
  margin-bottom: 6px;
}
.card-subtext-desc {
  font-size: 12px;
  color: var(--text-gray);
  line-height: 1.4;
  margin-bottom: 12px;
}
.card-action-trigger-label {
  font-size: 11px;
  color: #0078D4;
  font-weight: 600;
}
.tool-runtime-panel {
  display: none;
  background-color: var(--card-bg);
  border: 1px solid var(--border-color);
  border-radius: 12px;
  flex: 1;
  padding: 30px;
  flex-direction: column;
  box-sizing: border-box;
  overflow-y: auto;
}
.runtime-top-navigation {
  display: flex;
  justify-content: space-between;
  align-items: center;
  border-bottom: 1px solid var(--border-color);
  padding-bottom: 15px;
  margin-bottom: 25px;
}
.exit-runtime-btn {
  background-color: #333;
  color: var(--white);
  border: 1px solid var(--border-color);
  padding: 8px 18px;
  font-size: 13px;
  font-weight: 600;
  border-radius: 6px;
  cursor: pointer;
}
.exit-runtime-btn:hover { background-color: var(--acrobat-red); }
.merge-list-container {
  width: 100%;
  max-width: 550px;
  background: #151515;
  border: 1px solid var(--border-color);
  border-radius: 6px;
  padding: 15px;
  margin-bottom: 20px;
  min-height: 80px;
  text-align: left;
  box-sizing: border-box;
}
.merge-list-item {
  font-size: 13px;
  padding: 8px 12px;
  background: #252525;
  border: 1px solid var(--border-color);
  margin-bottom: 8px;
  border-radius: 4px;
  display: flex;
  justify-content: space-between;
  align-items: center;
}
.main-action-run-btn {
  background-color: var(--acrobat-red);
  color: var(--white);
  border: none;
  padding: 12px 28px;
  border-radius: 6px;
  font-weight: 700;
  cursor: pointer;
  font-size: 13px;
}
.secondary-action-btn {
  background-color: #444;
  color: var(--white);
  border: none;
  padding: 12px 28px;
  border-radius: 6px;
  font-weight: 700;
  cursor: pointer;
  font-size: 13px;
  margin-right: 10px;
}
.form-input-group {
  margin-bottom: 15px;
  width: 100%;
  max-width: 400px;
  text-align: left;
}
.form-input-group label {
  display: block;
  font-size: 12px;
  color: var(--text-gray);
  margin-bottom: 5px;
  font-weight: 600;
}
.form-input-group input, .form-input-group textarea, .form-input-group select {
  width: 100%;
  padding: 10px;
  background: #151515;
  border: 1px solid var(--border-color);
  border-radius: 6px;
  color: var(--white);
  box-sizing: border-box;
  font-size: 13px;
}
</style>
</head>
<body>
<header>
<div class="brand-section">
<span style="color: var(--acrobat-red); font-size: 20px;">■</span> PeetyF Pro
</div>
<div class="nav-tabs">
<button class="nav-btn" onclick="switchAcrobatCategory('file', this)">File</button>
<button class="nav-btn active" onclick="switchAcrobatCategory('edit', this)">Edit</button>
<button class="nav-btn" onclick="switchAcrobatCategory('convert', this)">Convert</button>
<button class="nav-btn" onclick="switchAcrobatCategory('esign', this)">E-sign</button>
</div>
<div class="domain-tag">brian-hilburn.com</div>
</header>
<main class="main-workspace">
<div class="character-branding-panel">
  <!-- Single unified frame pointing to your combined image asset (e.g. superhero-combined.jpg) -->
  <div class="hero-graphic-frame">
    <img src="superhero-combined.jpg" alt="PeetyF Combined Cinematic Hero">
  </div>
</div>
<div class="tools-view-workspace" id="toolsViewWorkspace">
<h2 class="grid-header-title" id="currentCategoryTitle">Edit Tools</h2>
<div class="functional-grid-system" id="toolGridBox">
</div>
</div>
<div class="tool-runtime-panel" id="toolRuntimePanel">
<div class="runtime-top-navigation">
<h2 id="runtimeTitleLabel" style="margin:0; font-size: 20px; font-weight: 700;">Tool Panel</h2>
<button class="exit-runtime-btn" onclick="exitFeatureRuntime()">X Close Tool</button>
</div>
<div id="runtimeCanvasCore" style="flex:1; display: flex; flex-direction:column; align-items:center; justify-content:center; color:var(--text-gray); font-size:14px; width:100%;"></div>
</div>
</main>
<script>
const toolsViewWorkspace = document.getElementById('toolsViewWorkspace');
const toolRuntimePanel = document.getElementById('toolRuntimePanel');
const currentCategoryTitle = document.getElementById('currentCategoryTitle');
const toolGridBox = document.getElementById('toolGridBox');
const runtimeTitleLabel = document.getElementById('runtimeTitleLabel');
const runtimeCanvasCore = document.getElementById('runtimeCanvasCore');

let activeWorkingFile = null;
let cacheMergeFilesPool = [];

const appBackupData = {
  file: `
    <div class="tool-grid-card" onclick="launchFeatureModule('Open Document', 'open-doc')">
      <div class="card-headline-row">📁 Open Document</div>
      <div class="card-subtext-desc">Load local PDF structures safely into active browser cache panels.</div>
      <div class="card-action-trigger-label">Select system source target</div>
    </div>
    <div class="tool-grid-card" onclick="launchFeatureModule('Save As', 'save-as')">
      <div class="card-headline-row">💾 Save As</div>
      <div class="card-subtext-desc">Export or compile current active memory adjustments into files.</div>
      <div class="card-action-trigger-label">Download local compilation copy</div>
    </div>
    <div class="tool-grid-card" onclick="launchFeatureModule('Print', 'print-doc')">
      <div class="card-headline-row">🖨️ Print</div>
      <div class="card-subtext-desc">Format and route data tables straight to active system hardware sheets.</div>
      <div class="card-action-trigger-label">Initialize print spool loop</div>
    </div>`,
  edit: `
    <div class="tool-grid-card" onclick="launchFeatureModule('Combine files', 'merge')">
      <div class="card-headline-row">+ Combine files</div>
      <div class="card-subtext-desc">Merge multiple separate files into a single clean PDF document natively.</div>
      <div class="card-action-trigger-label">Drag and drop, or select files</div>
    </div>
    <div class="tool-grid-card" onclick="launchFeatureModule('Edit text & images', 'edit-text')">
      <div class="card-headline-row">✏️ Edit text & images</div>
      <div class="card-subtext-desc">Modify or add text inscriptions directly to document pages.</div>
      <div class="card-action-trigger-label">Select file and add watermark/text</div>
    </div>
    <div class="tool-grid-card" onclick="launchFeatureModule('Split a PDF', 'split-pdf')">
      <div class="card-headline-row">✂️ Split a PDF</div>
      <div class="card-subtext-desc">Separate a large document file out into individual page files.</div>
      <div class="card-action-trigger-label">Select file to split</div>
    </div>
    <div class="tool-grid-card" onclick="launchFeatureModule('Crop pages', 'crop-pages')">
      <div class="card-headline-row">📐 Crop pages</div>
      <div class="card-subtext-desc">Trim page margins or scale layout dimensions cleanly.</div>
      <div class="card-action-trigger-label">Select PDF to trim</div>
    </div>
    <div class="tool-grid-card" onclick="launchFeatureModule('Delete pages', 'delete-pages')">
      <div class="card-headline-row">🗑️ Delete pages</div>
      <div class="card-subtext-desc">Remove selected unwanted page numbers cleanly from your PDF.</div>
      <div class="card-action-trigger-label">Select file and target pages</div>
    </div>
    <div class="tool-grid-card" onclick="launchFeatureModule('Extract pages', 'extract-pages')">
      <div class="card-headline-row">📑 Extract pages</div>
      <div class="card-subtext-desc">Create a brand new structural PDF using only selected pages.</div>
      <div class="card-action-trigger-label">Select pages to isolate</div>
    </div>`,
  convert: `
    <div class="tool-grid-card" onclick="launchFeatureModule('PDF to Word', 'pdf-to-word')">
      <div class="card-headline-row">🔄 PDF to Word</div>
      <div class="card-subtext-desc">Convert standard PDF text vectors directly into editable Word documents.</div>
      <div class="card-action-trigger-label">Select PDF to convert</div>
    </div>
    <div class="tool-grid-card" onclick="launchFeatureModule('Word to PDF', 'word-to-pdf')">
      <div class="card-headline-row">📄 Word to PDF</div>
      <div class="card-subtext-desc">Transform native text strings cleanly into secure downloadable PDFs.</div>
      <div class="card-action-trigger-label">Input text or upload doc</div>
    </div>
    <div class="tool-grid-card" onclick="launchFeatureModule('PDF to JPG', 'pdf-to-jpg')">
      <div class="card-headline-row">🖼️ PDF to JPG</div>
      <div class="card-subtext-desc">Render document pages out into flat sequential image picture files.</div>
      <div class="card-action-trigger-label">Select PDF page snapshots</div>
    </div>
    <div class="tool-grid-card" onclick="launchFeatureModule('JPG to PDF', 'jpg-to-pdf')">
      <div class="card-headline-row">📷 JPG to PDF</div>
      <div class="card-subtext-desc">Sequence local image photo assets together into a brand new PDF document.</div>
      <div class="card-action-trigger-label">Select photo files</div>
    </div>
    <div class="tool-grid-card" onclick="launchFeatureModule('Compress a PDF', 'compress-pdf')">
      <div class="card-headline-row">🗜️ Compress a PDF</div>
      <div class="card-subtext-desc">Rebuild and clean object streams to minimize file payload footprints.</div>
      <div class="card-action-trigger-label">Select PDF to compress</div>
    </div>`,
  esign: `
    <div class="tool-grid-card" onclick="launchFeatureModule('Fill & Sign', 'fill-sign')">
      <div class="card-headline-row">✍️ Fill & Sign</div>
      <div class="card-subtext-desc">Stamp custom text name fields and digital signatures onto documents.</div>
      <div class="card-action-trigger-label">Stamp document</div>
    </div>
    <div class="tool-grid-card" onclick="launchFeatureModule('Request e-signatures', 'request-sign')">
      <div class="card-headline-row">✉️ Request e-signatures</div>
      <div class="card-subtext-desc">Generate secure mailto tracking links for counterpart document signs.</div>
      <div class="card-action-trigger-label">Prepare request link</div>
    </div>
    <div class="tool-grid-card" onclick="launchFeatureModule('Create e-sign template', 'sign-template')">
      <div class="card-headline-row">📋 Create e-sign template</div>
      <div class="card-subtext-desc">Build reusable signature block layout grids.</div>
      <div class="card-action-trigger-label">Build template layout</div>
    </div>`
};

function switchAcrobatCategory(categoryKey, elementBtn) {
  document.querySelectorAll('.nav-btn').forEach(btn => btn.classList.remove('active'));
  elementBtn.classList.add('active');
  exitFeatureRuntime();
  if(categoryKey === 'file') currentCategoryTitle.innerText = "File Actions";
  if(categoryKey === 'edit') currentCategoryTitle.innerText = "Edit Tools";
  if(categoryKey === 'convert') currentCategoryTitle.innerText = "Convert Tools";
  if(categoryKey === 'esign') currentCategoryTitle.innerText = "E-sign Tools";
  toolGridBox.innerHTML = appBackupData[categoryKey];
}

window.addEventListener('DOMContentLoaded', () => {
  toolGridBox.innerHTML = appBackupData['edit'];
});

function launchFeatureModule(featureName, actionType) {
  toolsViewWorkspace.style.display = 'none';
  toolRuntimePanel.style.display = 'flex';
  runtimeTitleLabel.innerText = featureName;
  cacheMergeFilesPool = [];

  if (actionType === 'merge') {
    runtimeCanvasCore.innerHTML = `
      <div style="text-align:center; display: flex; flex-direction:column; align-items:center; width:100%; box-sizing: border-box;">
        <div class="merge-list-container" id="mergeListLayoutBox">
          <div style="color:#666; text-align:center; padding-top:25px; font-size:13px;">Select 2 or more PDF files to combine</div>
        </div>
        <div>
          <input type="file" id="fileQueueInputSlot" accept=".pdf" multiple style="display:none;" onchange="handleQueueLoading(event)" />
          <button class="secondary-action-btn" onclick="document.getElementById('fileQueueInputSlot').click()">+ Select Files</button>
          <button class="main-action-run-btn" onclick="executeLocalMergeAction()">Merge and Download</button>
        </div>
      </div>`;
  } else if (actionType === 'pdf-to-word') {
    runtimeCanvasCore.innerHTML = `
      <div style="text-align:center; display: flex; flex-direction:column; align-items:center; width: 100%; box-sizing: border-box;">
        <div class="merge-list-container" id="mergeListLayoutBox">
          <div style="color:#666; text-align:center; padding-top:25px; font-size:13px;">Select a PDF file to extract text layers</div>
        </div>
        <div>
          <input type="file" id="fileQueueInputSlot" accept=".pdf" style="display:none;" onchange="handleQueueLoading(event)" />
          <button class="secondary-action-btn" onclick="document.getElementById('fileQueueInputSlot').click()">Select PDF</button>
          <button class="main-action-run-btn" onclick="executePdfToWordAction()">Convert to Word (.doc)</button>
        </div>
      </div>`;
  } else if (actionType === 'split-pdf') {
    runtimeCanvasCore.innerHTML = `
      <div style="text-align:center; display: flex; flex-direction:column; align-items:center; width: 100%; box-sizing: border-box;">
        <div class="merge-list-container" id="mergeListLayoutBox">
          <div style="color:#666; text-align:center; padding-top:25px; font-size:13px;">Select a PDF file to split into individual pages</div>
        </div>
        <div>
          <input type="file" id="fileQueueInputSlot" accept=".pdf" style="display:none;" onchange="handleQueueLoading(event)" />
          <button class="secondary-action-btn" onclick="document.getElementById('fileQueueInputSlot').click()">Select PDF</button>
          <button class="main-action-run-btn" onclick="executeSplitPdfAction()">Split Into Separate Files</button>
        </div>
      </div>`;
  } else if (actionType === 'compress-pdf') {
    runtimeCanvasCore.innerHTML = `
      <div style="text-align:center; display: flex; flex-direction:column; align-items:center; width: 100%; box-sizing: border-box;">
        <div class="merge-list-container" id="mergeListLayoutBox">
          <div style="color:#666; text-align:center; padding-top:25px; font-size:13px;">Select a PDF file to optimize and compress</div>
        </div>
        <div>
          <input type="file" id="fileQueueInputSlot" accept=".pdf" style="display:none;" onchange="handleQueueLoading(event)" />
          <button class="secondary-action-btn" onclick="document.getElementById('fileQueueInputSlot').click()">Select PDF</button>
          <button class="main-action-run-btn" onclick="executeCompressPdfAction()">Compress & Download</button>
        </div>
      </div>`;
  } else if (actionType === 'delete-pages' || actionType === 'extract-pages') {
    const isExtract = actionType === 'extract-pages';
    runtimeCanvasCore.innerHTML = `
      <div style="text-align:center; display: flex; flex-direction:column; align-items:center; width: 100%; box-sizing: border-box;">
        <div class="merge-list-container" id="mergeListLayoutBox">
          <div style="color:#666; text-align:center; padding-top:25px; font-size:13px;">Select a PDF file</div>
        </div>
        <div class="form-input-group">
          <label>Target Page Numbers (comma separated, e.g. 1, 3, 4)</label>
          <input type="text" id="targetPagesInput" placeholder="1, 2, 3" />
        </div>
        <div>
          <input type="file" id="fileQueueInputSlot" accept=".pdf" style="display:none;" onchange="handleQueueLoading(event)" />
          <button class="secondary-action-btn" onclick="document.getElementById('fileQueueInputSlot').click()">Select PDF</button>
          <button class="main-action-run-btn" onclick="${isExtract ? 'executeExtractPagesAction()' : 'executeDeletePagesAction()'}">${isExtract ? 'Extract Pages' : 'Delete Pages'}</button>
        </div>
      </div>`;
  } else if (actionType === 'edit-text' || actionType === 'fill-sign') {
    const isSign = actionType === 'fill-sign';
    runtimeCanvasCore.innerHTML = `
      <div style="text-align:center; display: flex; flex-direction:column; align-items:center; width: 100%; box-sizing: border-box;">
        <div class="merge-list-container" id="mergeListLayoutBox">
          <div style="color:#666; text-align:center; padding-top:25px; font-size:13px;">Select a PDF file to stamp</div>
        </div>
        <div class="form-input-group">
          <label>${isSign ? 'Your Signature / Name' : 'Text to Stamp / Watermark'}</label>
          <input type="text" id="stampTextInput" value="${isSign ? 'Signed by B. Hilburn' : 'Approved - PeetyF Pro'}" />
        </div>
        <div>
          <input type="file" id="fileQueueInputSlot" accept=".pdf" style="display:none;" onchange="handleQueueLoading(event)" />
          <button class="secondary-action-btn" onclick="document.getElementById('fileQueueInputSlot').click()">Select PDF</button>
          <button class="main-action-run-btn" onclick="executeStampPdfAction()">${isSign ? 'Apply Signature & Download' : 'Stamp & Download'}</button>
        </div>
      </div>`;
  } else if (actionType === 'jpg-to-pdf') {
    runtimeCanvasCore.innerHTML = `
      <div style="text-align:center; display: flex; flex-direction:column; align-items:center; width: 100%; box-sizing: border-box;">
        <div class="merge-list-container" id="mergeListLayoutBox">
          <div style="color:#666; text-align:center; padding-top:25px; font-size:13px;">Select image files (JPG/PNG)</div>
        </div>
        <div>
          <input type="file" id="fileQueueInputSlot" accept="image/*" multiple style="display:none;" onchange="handleQueueLoading(event)" />
          <button class="secondary-action-btn" onclick="document.getElementById('fileQueueInputSlot').click()">+ Select Images</button>
          <button class="main-action-run-btn" onclick="executeImagesToPdfAction()">Convert to PDF</button>
        </div>
      </div>`;
  } else if (actionType === 'word-to-pdf') {
    runtimeCanvasCore.innerHTML = `
      <div style="text-align:center; display: flex; flex-direction:column; align-items:center; width: 100%; box-sizing: border-box;">
        <div class="form-input-group" style="max-width:550px;">
          <label>Type or Paste Text Content to Turn Into PDF</label>
          <textarea id="wordTextContentBox" rows="6" placeholder="Enter your document text here..."></textarea>
        </div>
        <div>
          <button class="main-action-run-btn" onclick="executeWordTextToPdfAction()">Generate PDF Document</button>
        </div>
      </div>`;
  } else if (actionType === 'pdf-to-jpg') {
    runtimeCanvasCore.innerHTML = `
      <div style="text-align:center; display: flex; flex-direction:column; align-items:center; width: 100%; box-sizing: border-box;">
        <div class="merge-list-container" id="mergeListLayoutBox">
          <div style="color:#666; text-align:center; padding-top:25px; font-size:13px;">Select a PDF file to convert pages to images</div>
        </div>
        <div>
          <input type="file" id="fileQueueInputSlot" accept=".pdf" style="display:none;" onchange="handleQueueLoading(event)" />
          <button class="secondary-action-btn" onclick="document.getElementById('fileQueueInputSlot').click()">Select PDF</button>
          <button class="main-action-run-btn" onclick="executePdfToJpgAction()">Export Pages as JPG</button>
        </div>
      </div>`;
  } else if (actionType === 'crop-pages') {
    runtimeCanvasCore.innerHTML = `
      <div style="text-align:center; display: flex; flex-direction:column; align-items:center; width: 100%; box-sizing: border-box;">
        <div class="merge-list-container" id="mergeListLayoutBox">
          <div style="color:#666; text-align:center; padding-top:25px; font-size:13px;">Select a PDF file to trim margins</div>
        </div>
        <div class="form-input-group">
          <label>Margin Trim Amount (Points, e.g., 20)</label>
          <input type="number" id="cropMarginInput" value="20" />
        </div>
        <div>
          <input type="file" id="fileQueueInputSlot" accept=".pdf" style="display:none;" onchange="handleQueueLoading(event)" />
          <button class="secondary-action-btn" onclick="document.getElementById('fileQueueInputSlot').click()">Select PDF</button>
          <button class="main-action-run-btn" onclick="executeCropPagesAction()">Trim Margins & Download</button>
        </div>
      </div>`;
  } else if (actionType === 'open-doc') {
    runtimeCanvasCore.innerHTML = `
      <div style="text-align:center; padding: 40px;">
        <h3 style="margin:0 0 6px 0; color:#FFF;">Open Document into Workspace</h3>
        <p style="margin:0 0 20px 0; font-size:13px; color:var(--text-gray);">Select a local document file to load into active memory.</p>
        <input type="file" id="fileQueueInputSlot" accept=".pdf,.doc,.docx" style="display:none;" onchange="handleQueueLoading(event)" />
        <button class="main-action-run-btn" onclick="document.getElementById('fileQueueInputSlot').click()">Browse Local Files</button>
      </div>`;
  } else if (actionType === 'save-as') {
    runtimeCanvasCore.innerHTML = `
      <div style="text-align:center; padding: 40px;">
        <h3 style="margin:0 0 6px 0; color:#FFF;">Save Active Document Copy</h3>
        <p style="margin:0 0 20px 0; font-size:13px; color:var(--text-gray);">Download your working state file straight to your local system.</p>
        <button class="main-action-run-btn" onclick="executeSaveAsWorkingFile()">Download Current File</button>
      </div>`;
  } else if (actionType === 'print-doc') {
    runtimeCanvasCore.innerHTML = `
      <div style="text-align:center; padding: 40px;">
        <h3 style="margin:0 0 6px 0; color:#FFF;">Print Spooler Interface</h3>
        <p style="margin:0 0 20px 0; font-size:13px; color:var(--text-gray);">Send active workspace content directly to your printer hardware.</p>
        <button class="main-action-run-btn" onclick="window.print()">Initialize Print Spool</button>
      </div>`;
  } else if (actionType === 'request-sign' || actionType === 'sign-template') {
    runtimeCanvasCore.innerHTML = `
      <div style="text-align:center; padding: 30px; max-width:450px;">
        <h3 style="margin:0 0 6px 0; color:#FFF;">${featureName}</h3>
        <p style="margin:0 0 15px 0; font-size:13px; color:var(--text-gray);">Enter recipient email address to generate a secure signing request mail link.</p>
        <div class="form-input-group">
          <label>Recipient Email Address</label>
          <input type="email" id="recipientEmailBox" placeholder="colleague@domain.com" />
        </div>
        <button class="main-action-run-btn" onclick="executeRequestSignAction()">Send Request Link</button>
      </div>`;
  } else {
    runtimeCanvasCore.innerHTML = `
      <div style="text-align:center; padding: 40px;">
        <h3 style="margin:0 0 6px 0; color:#FFF;">${featureName} Workspace</h3>
        <p style="margin:0 0 20px 0; font-size:13px; color:var(--text-gray);">Active tool ready.</p>
        <input type="file" id="fileQueueInputSlot" accept=".pdf" style="display:none;" onchange="handleQueueLoading(event)" />
        <button class="main-action-run-btn" onclick="document.getElementById('fileQueueInputSlot').click()">Select Document File</button>
      </div>`;
  }
}

function exitFeatureRuntime() {
  toolRuntimePanel.style.display = 'none';
  toolsViewWorkspace.style.display = 'block';
}

function handleQueueLoading(event) {
  const uploadedFiles = event.target.files;
  for (let i = 0; i < uploadedFiles.length; i++) {
    cacheMergeFilesPool.push(uploadedFiles[i]);
  }
  activeWorkingFile = cacheMergeFilesPool[0];
  refreshQueueListView();
}

function refreshQueueListView() {
  const listLayoutBox = document.getElementById('mergeListLayoutBox');
  if (!listLayoutBox) return;
  if (cacheMergeFilesPool.length === 0) {
    listLayoutBox.innerHTML = '<div style="color:#666; text-align:center; padding-top:25px; font-size:13px;">No file selected yet</div>';
    return;
  }
  listLayoutBox.innerHTML = '';
  cacheMergeFilesPool.forEach((file, index) => {
    listLayoutBox.innerHTML += `
      <div class="merge-list-item">
        <span>${file.name}</span>
        <span style="color:var(--acrobat-red); cursor:pointer; font-weight:bold;" onclick="removeQueuedItem(${index})">X</span>
      </div>`;
  });
}

function removeQueuedItem(index) {
  cacheMergeFilesPool.splice(index, 1);
  activeWorkingFile = cacheMergeFilesPool[0] || null;
  refreshQueueListView();
}

function downloadBlobAsFile(blobData, filename) {
  const downloadAnchor = document.createElement('a');
  downloadAnchor.href = URL.createObjectURL(blobData);
  downloadAnchor.download = filename;
  document.body.appendChild(downloadAnchor);
  downloadAnchor.click();
  document.body.removeChild(downloadAnchor);
}

// Full Functional Execution Handlers
async function executeLocalMergeAction() {
  if (cacheMergeFilesPool.length < 2) {
    alert("Please add 2 or more PDF documents to merge!");
    return;
  }
  try {
    const combinedMasterPdf = await PDFLib.PDFDocument.create();
    for (const targetFile of cacheMergeFilesPool) {
      const dataBuffer = await targetFile.arrayBuffer();
      const subPdfDoc = await PDFLib.PDFDocument.load(dataBuffer);
      const pagesToInject = await combinedMasterPdf.copyPages(subPdfDoc, subPdfDoc.getPageIndices());
      pagesToInject.forEach(page => combinedMasterPdf.addPage(page));
    }
    const compiledBytes = await combinedMasterPdf.save();
    downloadBlobAsFile(new Blob([compiledBytes], { type: 'application/pdf' }), 'PeetyF_Merged_Document.pdf');
    alert("Success! Documents combined successfully.");
  } catch (err) {
    console.error(err);
    alert("Error merging files. Ensure valid PDF inputs.");
  }
}

async function executePdfToWordAction() {
  if (!activeWorkingFile) { alert("Please select a PDF file first!"); return; }
  try {
    const arrayBuffer = await activeWorkingFile.arrayBuffer();
    const pdfDocument = await pdfjsLib.getDocument({data: new Uint8Array(arrayBuffer)}).promise;
    let compiledText = "";
    for (let i = 1; i <= pdfDocument.numPages; i++) {
      const page = await pdfDocument.getPage(i);
      const textContent = await page.getTextContent();
      compiledText += `Page ${i}\n\n` + textContent.items.map(item => item.str).join(" ") + "\n\n";
    }
    const wordContent = `<html xmlns:o='urn:schemas-microsoft-com:office:office' xmlns:w='urn:schemas-microsoft-com:office:word' xmlns='http://www.w3.org/TR/REC-html40'><body>${compiledText.replace(/\n/g, '<br>')}</body></html>`;
    downloadBlobAsFile(new Blob(['\ufeff' + wordContent], { type: 'application/msword' }), activeWorkingFile.name.replace(/\.[^/.]+$/, "") + "_Converted.doc");
    alert("Success! Exported to Word format.");
  } catch (err) {
    console.error(err);
    alert("Error extracting text layer from PDF.");
  }
}

async function executeSplitPdfAction() {
  if (!activeWorkingFile) { alert("Please select a PDF file first!"); return; }
  try {
    const arrayBuffer = await activeWorkingFile.arrayBuffer();
    const pdfDoc = await PDFLib.PDFDocument.load(arrayBuffer);
    const pageCount = pdfDoc.getPageCount();
    for (let i = 0; i < pageCount; i++) {
      const newPdf = await PDFLib.PDFDocument.create();
      const [copiedPage] = await newPdf.copyPages(pdfDoc, [i]);
      newPdf.addPage(copiedPage);
      const bytes = await newPdf.save();
      downloadBlobAsFile(new Blob([bytes], { type: 'application/pdf' }), `Split_Page_${i + 1}.pdf`);
    }
    alert(`Success! Split into ${pageCount} individual page files.`);
  } catch (err) {
    console.error(err);
    alert("Error splitting PDF.");
  }
}

async function executeCompressPdfAction() {
  if (!activeWorkingFile) { alert("Please select a PDF file first!"); return; }
  try {
    const arrayBuffer = await activeWorkingFile.arrayBuffer();
    const pdfDoc = await PDFLib.PDFDocument.load(arrayBuffer);
    const compressedBytes = await pdfDoc.save({ useObjectStreams: true });
    downloadBlobAsFile(new Blob([compressedBytes], { type: 'application/pdf' }), activeWorkingFile.name.replace(/\.[^/.]+$/, "") + "_Compressed.pdf");
    alert("Success! PDF compressed successfully.");
  } catch (err) {
    console.error(err);
    alert("Error compressing PDF.");
  }
}

async function executeDeletePagesAction() {
  if (!activeWorkingFile) { alert("Please select a PDF file first!"); return; }
  const rawInput = document.getElementById('targetPagesInput').value;
  const pagesToRemove = rawInput.split(',').map(n => parseInt(n.trim()) - 1).filter(n => !isNaN(n));
  try {
    const arrayBuffer = await activeWorkingFile.arrayBuffer();
    const pdfDoc = await PDFLib.PDFDocument.load(arrayBuffer);
    pagesToRemove.sort((a, b) => b - a);
    pagesToRemove.forEach(idx => {
      if (idx >= 0 && idx < pdfDoc.getPageCount()) {
        pdfDoc.removePage(idx);
      }
    });
    const bytes = await pdfDoc.save();
    downloadBlobAsFile(new Blob([bytes], { type: 'application/pdf' }), activeWorkingFile.name.replace(/\.[^/.]+$/, "") + "_DeletedPages.pdf");
    alert("Success! Selected pages removed.");
  } catch (err) {
    console.error(err);
    alert("Error deleting pages.");
  }
}

async function executeExtractPagesAction() {
  if (!activeWorkingFile) { alert("Please select a PDF file first!"); return; }
  const rawInput = document.getElementById('targetPagesInput').value;
  const pagesToExtract = rawInput.split(',').map(n => parseInt(n.trim()) - 1).filter(n => !isNaN(n));
  try {
    const arrayBuffer = await activeWorkingFile.arrayBuffer();
    const srcDoc = await PDFLib.PDFDocument.load(arrayBuffer);
    const newPdf = await PDFLib.PDFDocument.create();
    const copiedPages = await newPdf.copyPages(srcDoc, pagesToExtract);
    copiedPages.forEach(p => newPdf.addPage(p));
    const bytes = await newPdf.save();
    downloadBlobAsFile(new Blob([bytes], { type: 'application/pdf' }), activeWorkingFile.name.replace(/\.[^/.]+$/, "") + "_Extracted.pdf");
    alert("Success! Extracted pages into new PDF.");
  } catch (err) {
    console.error(err);
    alert("Error extracting pages.");
  }
}

async function executeStampPdfAction() {
  if (!activeWorkingFile) { alert("Please select a PDF file first!"); return; }
  const stampText = document.getElementById('stampTextInput').value || "Approved";
  try {
    const arrayBuffer = await activeWorkingFile.arrayBuffer();
    const pdfDoc = await PDFLib.PDFDocument.load(arrayBuffer);
    const helveticaFont = await pdfDoc.embedFont(PDFLib.StandardFonts.HelveticaBold);
    const pages = pdfDoc.getPages();
    pages.forEach(page => {
      const { width, height } = page.getSize();
      page.drawText(stampText, {
        x: 50,
        y: height - 50,
        size: 16,
        font: helveticaFont,
        color: PDFLib.rgb(0.98, 0.06, 0.0),
      });
    });
    const bytes = await pdfDoc.save();
    downloadBlobAsFile(new Blob([bytes], { type: 'application/pdf' }), activeWorkingFile.name.replace(/\.[^/.]+$/, "") + "_Signed.pdf");
    alert("Success! Document stamped and signed.");
  } catch (err) {
    console.error(err);
    alert("Error stamping PDF.");
  }
}

async function executeImagesToPdfAction() {
  if (cacheMergeFilesPool.length === 0) { alert("Please select at least one image file!"); return; }
  try {
    const pdfDoc = await PDFLib.PDFDocument.create();
    for (const imgFile of cacheMergeFilesPool) {
      const imgBytes = await imgFile.arrayBuffer();
      let embeddedImage;
      if (imgFile.type.includes('png')) {
        embeddedImage = await pdfDoc.embedPng(imgBytes);
      } else {
        embeddedImage = await pdfDoc.embedJpg(imgBytes);
      }
      const page = pdfDoc.addPage([embeddedImage.width, embeddedImage.height]);
      page.drawImage(embeddedImage, { x: 0, y: 0, width: embeddedImage.width, height: embeddedImage.height });
    }
    const bytes = await pdfDoc.save();
    downloadBlobAsFile(new Blob([bytes], { type: 'application/pdf' }), 'Converted_Images.pdf');
    alert("Success! Images converted to PDF.");
  } catch (err) {
    console.error(err);
    alert("Error converting images.");
  }
}

async function executeWordTextToPdfAction() {
  const textContent = document.getElementById('wordTextContentBox').value;
  if (!textContent.trim()) { alert("Please enter text content!"); return; }
  try {
    const pdfDoc = await PDFLib.PDFDocument.create();
    const page = pdfDoc.addPage([600, 800]);
    const font = await pdfDoc.embedFont(PDFLib.StandardFonts.Helvetica);
    page.drawText(textContent, { x: 50, y: 720, size: 12, font: font, color: PDFLib.rgb(0,0,0), lineHeight: 18, maxWidth: 500 });
    const bytes = await pdfDoc.save();
    downloadBlobAsFile(new Blob([bytes], { type: 'application/pdf' }), 'Document_From_Text.pdf');
    alert("Success! PDF generated from text.");
  } catch (err) {
    console.error(err);
    alert("Error generating PDF.");
  }
}

async function executePdfToJpgAction() {
  if (!activeWorkingFile) { alert("Please select a PDF file first!"); return; }
  try {
    const arrayBuffer = await activeWorkingFile.arrayBuffer();
    const pdfDoc = await pdfjsLib.getDocument({data: new Uint8Array(arrayBuffer)}).promise;
    for (let i = 1; i <= pdfDoc.numPages; i++) {
      const page = await pdfDoc.getPage(i);
      const viewport = page.getViewport({scale: 1.5});
      const canvas = document.createElement('canvas');
      canvas.width = viewport.width;
      canvas.height = viewport.height;
      const context = canvas.getContext('2d');
      await page.render({canvasContext: context, viewport: viewport}).promise;
      canvas.toBlob(blob => {
        downloadBlobAsFile(blob, `Page_${i}_Snapshot.jpg`);
      }, 'image/jpeg');
    }
    alert("Success! PDF pages exported as JPG images.");
  } catch (err) {
    console.error(err);
    alert("Error converting PDF to images.");
  }
}

async function executeCropPagesAction() {
  if (!activeWorkingFile) { alert("Please select a PDF file first!"); return; }
  const margin = parseFloat(document.getElementById('cropMarginInput').value) || 20;
  try {
    const arrayBuffer = await activeWorkingFile.arrayBuffer();
    const pdfDoc = await PDFLib.PDFDocument.load(arrayBuffer);
    pdfDoc.getPages().forEach(page => {
      const { x, y, width, height } = page.getMediaBox();
      page.setMediaBox(x + margin, y + margin, width - (margin * 2), height - (margin * 2));
    });
    const bytes = await pdfDoc.save();
    downloadBlobAsFile(new Blob([bytes], { type: 'application/pdf' }), activeWorkingFile.name.replace(/\.[^/.]+$/, "") + "_Cropped.pdf");
    alert("Success! Pages cropped successfully.");
  } catch (err) {
    console.error(err);
    alert("Error cropping pages.");
  }
}

function executeSaveAsWorkingFile() {
  if (!activeWorkingFile) { alert("No active file loaded in memory to save!"); return; }
  downloadBlobAsFile(activeWorkingFile, activeWorkingFile.name);
}

function executeRequestSignAction() {
  const email = document.getElementById('recipientEmailBox').value;
  if (!email) { alert("Please enter a recipient email address!"); return; }
  window.location.href = `mailto:${email}?subject=Document Signature Request&body=Please review and sign the attached document link.`;
}

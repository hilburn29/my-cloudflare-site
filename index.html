<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Brian Hilburn</title>
    <style>
        body {
            background-color: #111;
            margin: 0;
            padding: 20px;
            font-family: sans-serif;
            display: flex;
            justify-content: center;
        }
        .gallery {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            grid-gap: 15px;
            max-width: 1200px;
            width: 100%;
        }
        .gallery-item {
            width: 100%;
            height: 250px;
            object-fit: cover;
            border-radius: 8px;
            cursor: pointer;
            background-color: #222;
            transition: transform 0.2s;
        }
        .gallery-item:hover {
            transform: scale(1.02);
        }
        /* Fullscreen view when clicked */
        .lightbox {
            display: none;
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.9);
            justify-content: center;
            align-items: center;
            z-index: 1000;
        }
        .lightbox img, .lightbox video {
            max-width: 95%;
            max-height: 95%;
            border-radius: 4px;
        }
    </style>
</head>
<body>

    <div class="gallery" id="gallery"></div>

    <!-- Hidden pop-up box for magnifying media -->
    <div class="lightbox" id="lightbox" onclick="closeLightbox()">
        <div id="lightbox-content"></div>
    </div>

    <script>
        // Your exact GitHub details filled in automatically
        const repoOwner = "hilburn29"; 
        const repoName = "my-cloudflare-site"; 
        const folderPath = "Images";

        async function loadGallery() {
            const gallery = document.getElementById('gallery');
            try {
                const response = await fetch(`https://github.com{repoOwner}/${repoName}/contents/${folderPath}`);
                const files = await response.json();

                files.forEach(file => {
                    const ext = file.name.split('.').pop().toLowerCase();
                    let element;

                    // Standard image types
                    if (['jpg', 'jpeg', 'png', 'gif', 'webp', 'heic'].includes(ext)) {
                        element = document.createElement('img');
                        element.src = file.download_url;
                        element.className = 'gallery-item';
                        element.onclick = () => openLightbox('img', file.download_url);
                        gallery.appendChild(element);
                    } 
                    // Standard video types
                    else if (['mp4', 'mov', 'webm'].includes(ext)) {
                        element = document.createElement('video');
                        element.src = file.download_url;
                        element.className = 'gallery-item';
                        element.muted = true; 
                        element.playsInline = true;
                        element.onclick = () => openLightbox('video', file.download_url);
                        gallery.appendChild(element);
                    }
                });
            } catch (error) {
                console.error("Error loading files from GitHub:", error);
            }
        }

        function openLightbox(type, src) {
            const lightbox = document.getElementById('lightbox');
            const content = document.getElementById('lightbox-content');
            
            if (type === 'img') {
                content.innerHTML = `<img src="${src}">`;
            } else if (type === 'video') {
                content.innerHTML = `<video src="${src}" controls autoplay></video>`;
            }
            lightbox.style.display = 'flex';
        }

        function closeLightbox() {
            document.getElementById('lightbox').style.display = 'none';
            document.getElementById('lightbox-content').innerHTML = '';
        }

        loadGallery();
    </script>
</body>
</html>

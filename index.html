<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Brian Hilburn</title>
    <style>
        body {
            background-color: #111;
            margin: 0;
            padding: 20px;
            font-family: sans-serif;
            display: flex;
            flex-direction: column; /* Stacks the top section above the gallery */
            align-items: center;    /* Centers everything horizontally */
        }
        
        /* Top Section for the Bee Image */
        .top-container {
            width: 100%;
            display: flex;
            justify-content: center;
            margin-bottom: 30px; /* Space between bee image and the grid below */
            margin-top: 10px;
        }
        .header-image {
            width: 12.5%; /* Scaled down to exactly 1/8th of its original width */
            max-width: 150px; /* Prevents it from getting too large on big screens */
            height: auto;
            border-radius: 8px;
            cursor: pointer;
            transition: transform 0.2s;
        }
        .header-image:hover {
            transform: scale(1.05);
        }

        /* The Main Image Grid underneath */
        .gallery {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            grid-gap: 15px;
            max-width: 1200px;
            width: 100%;
        }
        .gallery-item {
            width: 100%;
            height: 250px;
            object-fit: cover;
            border-radius: 8px;
            cursor: pointer;
            background-color: #222;
            transition: transform 0.2s;
        }
        .gallery-item:hover {
            transform: scale(1.02);
        }

        /* Fullscreen Pop-up Box */
        .lightbox {
            display: none;
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.9);
            justify-content: center;
            align-items: center;
            z-index: 1000;
        }
        .lightbox img {
            max-width: 95%;
            max-height: 95%;
            border-radius: 4px;
        }
    </style>
</head>
<body>

    <!-- Top Featured Center Section -->
    <div class="top-container">
        <img src="https://githubusercontent.com" class="header-image" onclick="openLightbox(this.src)">
    </div>

    <!-- Main Gallery Section (All other images below) -->
    <div class="gallery">
        <img src="https://githubusercontent.com" class="gallery-item" onclick="openLightbox(this.src)">
        <img src="https://githubusercontent.com" class="gallery-item" onclick="openLightbox(this.src)">
        <img src="https://githubusercontent.com" class="gallery-item" onclick="openLightbox(this.src)">
        <img src="https://githubusercontent.com" class="gallery-item" onclick="openLightbox(this.src)">
        <img src="https://githubusercontent.com" class="gallery-item" onclick="openLightbox(this.src)">
        <img src="https://githubusercontent.com" class="gallery-item" onclick="openLightbox(this.src)">
        <img src="https://githubusercontent.com" class="gallery-item" onclick="openLightbox(this.src)">
    </div>

    <!-- Hidden pop-up box for expanding images -->
    <div class="lightbox" id="lightbox" onclick="closeLightbox()">
        <div id="lightbox-content"></div>
    </div>

    <script>
        function openLightbox(src) {
            const lightbox = document.getElementById('lightbox');
            const content = document.getElementById('lightbox-content');
            content.innerHTML = `<img src="${src}">`;
            lightbox.style.display = 'flex';
        }

        function closeLightbox() {
            document.getElementById('lightbox').style.display = 'none';
            document.getElementById('lightbox-content').innerHTML = '';
        }
    </script>
</body>
</html>

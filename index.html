<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PeetyF Pro - Document Dashboard</title>
    <!-- Core client-side PDF libraries -->
    <script src="https://cloudflare.com"></script>
    <script src="https://cloudflare.com"></script>
    <style>
        :root {
            --acrobat-red: #FA0F00;
            --dark-canvas: #1E1E1E; /* Rich premium dark background matching cover sheet */
            --card-bg: #2B2B2B;     
            --border-color: #3D3D3D;
            --white: #FFFFFF;
            --text-light: #F5F5F5;
            --text-gray: #B0B0B0;
        }

        body {
            margin: 0;
            font-family: 'Segoe UI', -apple-system, BlinkMacSystemFont, Roboto, sans-serif;
            background-color: var(--dark-canvas);
            color: var(--text-light);
            height: 100vh;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        /* Top bar matching blueprint dimensions */
        header {
            background-color: #151515;
            border-bottom: 1px solid var(--border-color);
            padding: 12px 30px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .brand-section {
            display: flex;
            align-items: center;
            gap: 10px;
            font-weight: 700;
            font-size: 18px;
            letter-spacing: 0.5px;
        }

        /* Nav tabs strictly tracking File, Edit, Convert, E-sign from mockup */
        .nav-tabs {
            display: flex;
            background: #252525;
            border: 1px solid var(--border-color);
            border-radius: 6px;
            padding: 3px;
        }

        .nav-btn {
            background: none;
            border: none;
            color: var(--text-gray);
            padding: 6px 18px;
            font-size: 13px;
            font-weight: 600;
            cursor: pointer;
            border-radius: 4px;
            transition: all 0.2s;
        }

        .nav-btn.active, .nav-btn:hover {
            background-color: var(--acrobat-red);
            color: var(--white);
        }

        .domain-tag {
            font-size: 13px;
            color: var(--text-gray);
            font-weight: 600;
        }

        .main-workspace {
            display: flex;
            padding: 25px;
            gap: 25px;
            box-sizing: border-box;
            overflow: hidden;
            height: calc(100vh - 60px);
            width: 100%;
        }

        /* Left Side Panel Profile Component Setup */
        .character-branding-panel {
            width: 340px;
            min-width: 340px;
            background-color: #151515;
            border: 1px solid var(--border-color);
            border-radius: 12px;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: space-between;
            box-sizing: border-box;
            overflow: hidden;
        }

        /* Smooth high-definition photo bounding box */
        .hero-graphic-frame {
            width: 100%;
            flex: 1;
            border-radius: 8px;
            background-color: #252525;
            background-image: url('https://unsplash.com');
            background-size: cover;
            background-position: center top;
            margin-bottom: 20px;
            border: 1px solid var(--border-color);
        }

        .app-main-title {
            font-size: 42px;
            font-weight: 800;
            margin: 0;
            color: var(--white);
            letter-spacing: -1.5px;
            font-style: italic;
        }
        .app-main-title span { color: #DDAA00; } /* Gold accent texture from mockup font */

        .app-sub-prompt {
            font-size: 13px;
            color: var(--text-gray);
            margin: 6px 0 0 0;
            font-weight: 600;
            letter-spacing: 0.5px;
        }

        .tools-view-workspace {
            flex: 1;
            overflow-y: auto;
            padding-right: 5px;
            display: block;
        }

        .grid-header-title {
            font-size: 24px;
            font-weight: 700;
            margin: 0 0 20px 0;
            color: var(--white);
            border-bottom: 2px solid var(--acrobat-red);
            padding-bottom: 8px;
        }

        .functional-grid-system {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(240px, 1fr));
            gap: 16px;
        }

        .tool-grid-card {
            background-color: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 8px;
            padding: 20px;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            cursor: pointer;
            transition: transform 0.15s, border-color 0.15s;
            min-height: 130px;
            box-sizing: border-box;
        }

        .tool-grid-card:hover {
            transform: translateY(-2px);
            border-color: var(--acrobat-red);
            background-color: #353535;
        }

        .card-headline-row {
            display: flex;
            align-items: center;
            gap: 10px;
            font-weight: 700;
            font-size: 15px;
            color: var(--white);
            margin-bottom: 6px;
        }

        .card-subtext-desc {
            font-size: 12px;
            color: var(--text-gray);
            line-height: 1.4;
            margin-bottom: 12px;
        }

        .card-action-trigger-label {
            font-size: 11px;
            color: #0078D4; 
            font-weight: 600;
        }

        .tool-runtime-panel {
            display: none;
            background-color: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            flex: 1;
            padding: 30px;
            flex-direction: column;
            box-sizing: border-box;
        }

        .runtime-top-navigation {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid var(--border-color);
            padding-bottom: 15px;
            margin-bottom: 25px;
        }

        .exit-runtime-btn {
            background-color: #333;
            color: var(--white);
            border: 1px solid var(--border-color);
            padding: 8px 18px;
            font-size: 13px;
            font-weight: 600;
            border-radius: 6px;
            cursor: pointer;
        }
        .exit-runtime-btn:hover { background-color: var(--acrobat-red); }

        .merge-list-container {
            width: 100%;
            max-width: 550px;
            background: #151515;
            border: 1px solid var(--border-color);
            border-radius: 6px;
            padding: 15px;
            margin-bottom: 20px;
            min-height: 100px;
            text-align: left;
            box-sizing: border-box;
        }
        .merge-list-item {
            font-size: 13px;
            padding: 8px 12px;
            background: #252525;
            border: 1px solid var(--border-color);
            margin-bottom: 8px;
            border-radius: 4px;
            display: flex;
            justify-content: space-between;
        }
        .main-action-run-btn {
            background-color: var(--acrobat-red);
            color: var(--white);
            border: none;
            padding: 12px 28px;
            border-radius: 6px;
            font-weight: 700;
            cursor: pointer;
            font-size: 13px;
        }
        .secondary-action-btn {
            background-color: #444;
            color: var(--white);
            border: none;
            padding: 12px 28px;
            border-radius: 6px;
            font-weight: 700;
            cursor: pointer;
            font-size: 13px;
            margin-right: 10px;
        }
    </style>
</head>
<body>

    <header>
        <div class="brand-section">
            <span style="color: var(--acrobat-red); font-size: 20px;">📄</span> PeetyF Pro
        </div>
        
        <div class="nav-tabs">
            <button class="nav-btn" onclick="switchAcrobatCategory('file', this)">File</button>
            <button class="nav-btn active" onclick="switchAcrobatCategory('edit', this)">Edit</button>
            <button class="nav-btn" onclick="switchAcrobatCategory('convert', this)">Convert</button>
            <button class="nav-btn" onclick="switchAcrobatCategory('esign', this)">E-sign</button>
        </div>

        <div class="domain-tag">brian-hilburn.com</div>
    </header>

    <main class="main-workspace">
        
        <!-- Left Column Profile Framework Cloned from your Cover Sheet Attachment -->
        <div class="character-branding-panel">
            <div class="hero-graphic-frame" style="display: flex; align-items: center; justify-content: center; overflow: hidden; border-radius: 8px; border: none; background-color: transparent;">
    <img src="superhero.jog" style="width: 100%; height: 100%; object-fit: contain;" alt="PeetyF Cinematic Hero">
<div class="hero-graphic-frame" style="display: flex; align-items: center; justify-content: center; overflow: hidden; border-radius: 8px; border: none; background-color: transparent; height: 340px; margin-bottom: 20px;">
    <img src="superhero.jpg" style="width: 100%; height: 100%; object-fit: contain;" alt="PeetyF Cinematic Hero">
</div>               <h1 class="app-main-title">Peety<span>F</span></h1>
                <div class="app-sub-prompt">Coming to a computer near you!</div>
            </div>
        </div>

        <div class="tools-view-workspace" id="toolsViewWorkspace">
            <h2 class="grid-header-title" id="currentCategoryTitle">Edit Tools</h2>
            <div class="functional-grid-system" id="toolGridBox">
                <!-- Hardcoded static layouts boot natively here -->
            </div>
        </div>

        <div class="tool-runtime-panel" id="toolRuntimePanel">
            <div class="runtime-top-navigation">
        <div class="tool-runtime-panel" id="toolRuntimePanel">
            <div class="runtime-top-navigation">
                <h2 id="runtimeTitleLabel" style="margin:0; font-size: 20px; font-weight: 700;">Tool Panel</h2>
                <button class="exit-runtime-btn" onclick="exitFeatureRuntime()">✕ Close Tool</button>
            </div>
            <div id="runtimeCanvasCore" style="flex:1; display:flex; flex-direction:column; align-items:center; justify-content:center; color:var(--text-gray); font-size:14px; width:100%;"></div>
        </div>
    </main>

    <script>
        const toolsViewWorkspace = document.getElementById('toolsViewWorkspace');
        const toolRuntimePanel = document.getElementById('toolRuntimePanel');
        const currentCategoryTitle = document.getElementById('currentCategoryTitle');
        const toolGridBox = document.getElementById('toolGridBox');
        const runtimeTitleLabel = document.getElementById('runtimeTitleLabel');
        const runtimeCanvasCore = document.getElementById('runtimeCanvasCore');

        let cacheMergeFilesPool = [];

        const appBackupData = {
            file: `
                <div class="tool-grid-card" onclick="alert('File Engine Configured')">
                    <div class="card-headline-row">📂 Open Document</div>
                    <div class="card-subtext-desc">Load local PDF structures safely into active browser cache panels.</div>
                    <div class="card-action-trigger-label">Select system source target</div>
                </div>
                <div class="tool-grid-card" onclick="alert('File Engine Configured')">
                    <div class="card-headline-row">💾 Save As</div>
                    <div class="card-subtext-desc">Export or compile current active memory adjustments into files.</div>
                    <div class="card-action-trigger-label">Download local compilation copy</div>
                </div>
                <div class="tool-grid-card" onclick="alert('File Engine Configured')">
                    <div class="card-headline-row">🖨️ Print</div>
                    <div class="card-subtext-desc">Format and route data tables straight to active system hardware sheets.</div>
                    <div class="card-action-trigger-label">Initialize print spool loop</div>
                </div>`,
            edit: `
                <div class="tool-grid-card" onclick="launchFeatureModule('Combine files', 'merge')">
                    <div class="card-headline-row">➕ Combine files</div>
                    <div class="card-subtext-desc">Merge multiple separate files into a single clean PDF document natively.</div>
                    <div class="card-action-trigger-label">Drag and drop, or select a file</div>
                </div>
                <div class="tool-grid-card" onclick="launchFeatureModule('Edit text & images', 'generic')">
                    <div class="card-headline-row">📝 Edit text & images</div>
                    <div class="card-subtext-desc">Modify or add text, images, pages, and more.</div>
                    <div class="card-action-trigger-label">Drag and drop, or select a file</div>
                </div>
                <div class="tool-grid-card" onclick="launchFeatureModule('Split a PDF', 'generic')">
                    <div class="card-headline-row">✂️ Split a PDF</div>
                    <div class="card-subtext-desc">Separate a large document file out into multiple individual files.</div>
                    <div class="card-action-trigger-label">Drag and drop, or select a file</div>
                </div>
                <div class="tool-grid-card" onclick="launchFeatureModule('Crop pages', 'generic')">
                    <div class="card-headline-row">🖼️ Crop pages</div>
                    <div class="card-subtext-desc">Trim page layout content height, adjust outer margins, or resize sizes.</div>
                    <div class="card-action-trigger-label">Drag and drop, or select a file</div>
                </div>
                <div class="tool-grid-card" onclick="launchFeatureModule('Delete pages', 'generic')">
                    <div class="card-headline-row">🗑️ Delete pages</div>
                    <div class="card-subtext-desc">Remove selected faulty or unneeded pages cleanly from your PDF.</div>
                    <div class="card-action-trigger-label">Drag and drop, or select a file</div>
                </div>
                <div class="tool-grid-card" onclick="launchFeatureModule('Extract pages', 'generic')">
                    <div class="card-headline-row">📄 Extract pages</div>
                    <div class="card-subtext-desc">Create a brand new structural PDF using only selected pages.</div>
                    <div class="card-action-trigger-label">Drag and drop, or select a file</div>
                </div>`,
            convert: `
                <div class="tool-grid-card" onclick="launchFeatureModule('PDF to Word', 'pdf-to-word')">
                    <div class="card-headline-row">🟦 PDF to Word</div>
                    <div class="card-subtext-desc">Convert standard PDF layouts directly into Microsoft Word document formatting.</div>
                    <div class="card-action-trigger-label">Drag and drop, or select a file</div>
                </div>
                <div class="tool-grid-card" onclick="launchFeatureModule('Word to PDF', 'generic')">
                    <div class="card-headline-row">📄 Word to PDF</div>
                    <div class="card-subtext-desc">Transform native Microsoft Word doc text files cleanly into secure PDFs.</div>
                    <div class="card-action-trigger-label">Drag and drop, or select a file</div>
                </div>
                <div class="tool-grid-card" onclick="launchFeatureModule('PDF to JPG', 'generic')">
                    <div class="card-headline-row">🖼️ PDF to JPG</div>
                    <div class="card-subtext-desc">Convert document page vectors out into flat sequential image picture structures.</div>
                    <div class="card-action-trigger-label">Drag and drop, or select a file</div>
                </div>
                <div class="tool-grid-card" onclick="launchFeatureModule('JPG to PDF', 'generic')">
                    <div class="card-headline-row">🎨 JPG to PDF</div>
                    <div class="card-subtext-desc">Sequence local image photo assets together into a brand new PDF document.</div>
                    <div class="card-action-trigger-label">Drag and drop, or select a file</div>
                </div>
                <div class="tool-grid-card" onclick="launchFeatureModule('Compress a PDF', 'generic')">
                    <div class="card-headline-row">🗜️ Compress a PDF</div>
                    <div class="card-subtext-desc">Optimize structural element density to decrease final file footprint sizes.</div>
                    <div class="card-action-trigger-label">Drag and drop, or select a file</div>
                </div>`,
            esign: `
                <div class="tool-grid-card" onclick="launchFeatureModule('Fill & Sign', 'generic')">
                    <div class="card-headline-row">✍️ Fill & Sign</div>
                    <div class="card-subtext-desc">Complete form boxes and add your custom digital ink signature directly.</div>
                    <div class="card-action-trigger-label">Drag and drop, or select a file</div>
                </div>
                <div class="tool-grid-card" onclick="launchFeatureModule('Request e-signatures', 'generic')">
                    <div class="card-headline-row">✉️ Request e-signatures</div>
                    <div class="card-subtext-desc">Send an open document out to anyone to track and collect secure online signs fast.</div>
                    <div class="card-action-trigger-label">Drag and drop, or select a file</div>
                </div>
                <div class="tool-grid-card" onclick="launchFeatureModule('Create e-sign template', 'generic')">
                    <div class="card-headline-row">📋 Create e-sign template</div>
                    <div class="card-subtext-desc">Build reusable target sheets to speed up recurring agreement cycles.</div>
                    <div class="card-action-trigger-label">Drag and drop, or select a file</div>
                </div>`
        };

        function switchAcrobatCategory(categoryKey, elementBtn) {
            document.querySelectorAll('.nav-btn').forEach(btn => btn.classList.remove('active'));
            elementBtn.classList.add('active');
            exitFeatureRuntime();
            
            if(categoryKey === 'file') currentCategoryTitle.innerText = "File Actions";
            if(categoryKey === 'edit') currentCategoryTitle.innerText = "Edit Tools";
            if(categoryKey === 'convert') currentCategoryTitle.innerText = "Convert Tools";
            if(categoryKey === 'esign') currentCategoryTitle.innerText = "E-sign Tools";
            
            toolGridBox.innerHTML = appBackupData[categoryKey];
        }

        window.addEventListener('DOMContentLoaded', () => {
            toolGridBox.innerHTML = appBackupData['edit'];
        });

                function launchFeatureModule(featureName, actionType) {
            toolsViewWorkspace.style.display = 'none';
            toolRuntimePanel.style.display = 'flex';
            runtimeTitleLabel.innerText = featureName;

            if (actionType === 'merge') {
                cacheMergeFilesPool = [];
                renderInteractiveMergeCanvas();
            } else if (actionType === 'pdf-to-word') {
                cacheMergeFilesPool = [];
                runtimeCanvasCore.innerHTML = `
                    <div style="text-align:center; display:flex; flex-direction:column; align-items:center; width:100%; box-sizing:border-box;">
                        <div class="merge-list-container" id="mergeListLayoutBox">
                            <div style="color:#666; text-align:center; padding-top:25px; font-size:13px;">Select a PDF file to extract text layers</div>
                        </div>
                        <div>
                            <input type="file" id="fileQueueInputSlot" accept=".pdf" style="display:none;" onchange="handleQueueLoading(event)" />
                            <button class="secondary-action-btn" onclick="document.getElementById('fileQueueInputSlot').click()">📂 Select PDF</button>
                            <button class="main-action-run-btn" onclick="executePdfToWordAction()">Convert to Word</button>
                        </div>
                    </div>
                `;
            } else {
                runtimeCanvasCore.innerHTML = `
                    <div style="text-align:center; padding: 40px;">
                        <div style="font-size: 48px; margin-bottom: 12px;">🛠️</div>
                        <h3 style="margin:0 0 6px 0; color:#FFF;">${featureName} Processing Workspace</h3>
                        <p style="margin:0 0 20px 0; font-size:13px; color:var(--text-gray);">This specific task module frame is built and structurally linked to your dashboard rows.</p>
                        <input type="file" id="targetLocalInput" style="display:none;" />
                        <button class="main-action-run-btn" onclick="document.getElementById('targetLocalInput').click()">Select Document File</button>
                    </div>
                `;
            }
        }
        function exitFeatureRuntime() {
            toolRuntimePanel.style.display = 'none';
            toolsViewWorkspace.style.display = 'block';
        }

        function renderInteractiveMergeCanvas() {
            runtimeCanvasCore.innerHTML = `
                <div style="text-align:center; display:flex; flex-direction:column; align-items:center; width:100%; box-sizing:border-box;">
                    <div class="merge-list-container" id="mergeListLayoutBox">
                        <div style="color:#666; text-align:center; padding-top:25px; font-size:13px;">Drag and drop, or select a file to queue</div>
                    </div>
                    <div>
                        <input type="file" id="fileQueueInputSlot" accept=".pdf" multiple style="display:none;" onchange="handleQueueLoading(event)" />
                        <button class="secondary-action-btn" onclick="document.getElementById('fileQueueInputSlot').click()">＋ Select Files</button>
                        <button class="main-action-run-btn" onclick="executeLocalMergeAction()">Merge and Save</button>
                    </div>
                </div>
            `;
        }

        function handleQueueLoading(event) {
            const uploadedFiles = event.target.files;
            for (let i = 0; i < uploadedFiles.length; i++) {
                cacheMergeFilesPool.push(uploadedFiles[i]);
            }
            refreshQueueListView();
        }

        function refreshQueueListView() {
            const listLayoutBox = document.getElementById('mergeListLayoutBox');
            if (cacheMergeFilesPool.length === 0) {
                listLayoutBox.innerHTML = `<div style="color:#666; text-align:center; padding-top:25px; font-size:13px;">Drag and drop, or select a file to queue</div>`;
                return;
            }
            listLayoutBox.innerHTML = '';
            cacheMergeFilesPool.forEach((file, index) => {
                listLayoutBox.innerHTML += `
                    <div class="merge-list-item">
                        <span>📄 ${file.name}</span>
                        <span style="color:var(--acrobat-red); cursor:pointer; font-weight:bold;" onclick="removeQueuedItem(${index})">✕</span>
                    </div>
                `;
            });
        }

        function removeQueuedItem(index) {
            cacheMergeFilesPool.splice(index, 1);
            refreshQueueListView();
        }
        async function executePdfToWordAction() {
            if (cacheMergeFilesPool.length === 0) {
                alert("Please select a PDF document to convert first!");
                return;
            }
            try {
                const targetFile = cacheMergeFilesPool[0];
                const arrayBuffer = await targetFile.arrayBuffer();
                const pdfData = new Uint8Array(arrayBuffer);
                
                const loadingTask = pdfjsLib.getDocument({data: pdfData});
                const pdfDocument = await loadingTask.promise;
                let compiledText = "";
                
                for (let i = 1; i <= pdfDocument.numPages; i++) {
                    const page = await pdfDocument.getPage(i);
                    const textContent = await page.getTextContent();
                    const pageText = textContent.items.map(item => item.str).join(" ");
                    compiledText += `Page ${i}\n\n` + pageText + "\n\n";
                }
                
                const wordContent = `
                    <html xmlns:o='urn:schemas-microsoft-com:office:office' xmlns:w='urn:schemas-microsoft-com:office:word' xmlns='http://w3.org'>
                    <head><title>PeetyF Converted Document</title><style>body {font-family: 'Segoe UI', Arial;}</style></head>
                    <body>${compiledText.replace(/\n/g, '<br>')}</body>
                    </html>
                `;
                
                const blob = new Blob(['\ufeff' + wordContent], { type: 'application/msword' });
                const downloadAnchor = document.createElement('a');
                downloadAnchor.href = URL.createObjectURL(blob);
                downloadAnchor.download = targetFile.name.replace(/\.[^/.]+\$/, "") + "_Converted.doc";
                document.body.appendChild(downloadAnchor);
                downloadAnchor.click();
                document.body.removeChild(downloadAnchor);
                
                alert("Success! Your PDF text layers were extracted and saved as a Word document!");
            } catch (err) {
                console.error(err);
                alert("Error reading document vector text frames. Ensure the file is not scanned text.");
            }
        }
        async function executeLocalMergeAction() {
            if (cacheMergeFilesPool.length < 2) {
                alert("Please add 2 or more PDF documents to process a merge operation!");
                return;
            }

            try {
                const combinedMasterPdf = await PDFLib.PDFDocument.create();
                
                for (const targetFile of cacheMergeFilesPool) {
                    const dataBuffer = await targetFile.arrayBuffer();
                    const subPdfDoc = await PDFLib.PDFDocument.load(dataBuffer);
                    const pagesToInject = await combinedMasterPdf.copyPages(subPdfDoc, subPdfDoc.getPageIndices());
                    pagesToInject.forEach(page => combinedMasterPdf.addPage(page));
                }

                const compiledBytes = await combinedMasterPdf.save();
                const arrayBlob = new Blob([compiledBytes], { type: 'application/pdf' });
                const downloadAnchor = document.createElement('a');
                downloadAnchor.href = URL.createObjectURL(arrayBlob);
                downloadAnchor.download = 'PeetyF_Merged_Document.pdf';
                document.body.appendChild(downloadAnchor);
                downloadAnchor.click();
                document.body.removeChild(downloadAnchor);
                
                alert("Success! Your documents were cleanly combined and saved back to your Windows laptop!");
            } catch (err) {
                console.error(err);
                alert("Roadblock encountered during document parsing structure validation frames.");
            }
        }
    </script>
</body>
</html>
